<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Groups - Connect U</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + label {
            transform: scale(1.05);
            outline: 2px solid;
            outline-offset: 3px;
        }
        
        .post-type label{
            font-size: 0.8rem;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 4px;
            background-color: var(--primary-color);
            color: var(--text-light);
            margin: 10px;
            vertical-align: middle;
        }

        #research + label { 
            background-color: var(--research); 
            outline-color: var(--research);}
        #study + label    { 
            background-color: var(--study); 
            outline-color: var(--study);}
        #social + label   { 
            background-color: var(--social); 
            outline-color: var(--social);}
        #work + label     { 
            background-color: var(--work); 
            outline-color: var(--work);}
        #other + label    { 
            background-color: var(--other); 
            outline-color: var(--other);}

        label:hover {
            opacity: 0.9;
        }

        .create-post-container {
            max-width: 80%;
            margin: 20px auto;
            background-color: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            border: 1px solid #eee;
            transition: border-color 0.2s, transform 0.2s;
        }

        .post-section {
            margin-bottom: 30px;
        }

        .post-section h3 {
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--secondary-color);
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }

        .button-group label {
            margin: 0 !important;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: center;
            min-width: 100px;
        }

        .standard-btn {
            background-color: #eee;
            color: #333 !important;
        }

        .full-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
        }

        .submit-post {
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
        } 
    </style>
</head>
<body>
    <header>
        <a href="{{ url_for('home') }}"><div class="logo">Connect U</div></a>
        <nav>
            {% if session.get('usergivenname') %}
            <a href="{{ url_for('logout') }}">Hey, {{ session['usergivenname'] }}</a>
            {% else %}
            <a href="{{ url_for('login') }}">Login/Sign Up</a>
            {% endif %}
            <a href="#groups">Groups</a>
            <a href="#notifications">Notifications</a>
        </nav>
    </header>

    <div class="create-post-container">
        <form action="/submit-post" method="POST">
            <div class="post-section">
                <h3>Select Post Tags</h3>
                <div class="button-group">
                    <input type="radio" id="research" name="tag" value="research">
                    <label for="research">RESEARCH</label>

                    <input type="radio" id="study" name="tag" value="study">
                    <label for="study">STUDY</label>

                    <input type="radio" id="social" name="tag" value="social">
                    <label for="social">SOCIAL</label>

                    <input type="radio" id="work" name="tag" value="work">
                    <label for="work">WORK</label>

                    <input type="radio" id="other" name="tag" value="other">
                    <label for="other">OTHER</label>
                </div>
            </div>

            <div class="post-section">
                <h3>Who can Join</h3>
                <div class="button-group">
                    <input type="radio" id="join-anyone" name="privacy" value="anyone">
                    <label for="join-anyone" class="standard-btn">Anyone</label>

                    <input type="radio" id="join-request" name="privacy" value="request">
                    <label for="join-request" class="standard-btn">Request</label>

                    <input type="radio" id="join-private" name="privacy" value="private">
                    <label for="join-private" class="standard-btn">Private</label>
                </div>
            </div>

            <div class="post-info">
                <h3>Post Description</h3>
                <input type="text" name="title" class="full-input" placeholder="Enter Title">
                <input type="text" name="description" class="full-input" placeholder="What is your post about?" rows="4">
            </div>

            <button type="submit" class="cta-primary submit-post">Create Post</button>
        </form>
    </div>


    <footer>
        <p>&copy; 2025 Connect U. Built for students.</p>
    </footer>
</body>
</html>
